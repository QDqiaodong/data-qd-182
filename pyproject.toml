[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "data-qd-182"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
loom-draft = "loom_draft.cli:main"
loom-batch = "loom_draft.batch_cli:main"
loom-trace = "loom_draft.trace_cli:main"
loom-dispatch = "loom_draft.dispatch_cli:main"
loom-inspect = "loom_draft.inspect_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
